<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Scents</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/236x/89/55/9e/89559ea3c39439bebdfa0c89d402a6a3.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap');
        
        :root {
            --primary: #8B5A2B;
            --secondary: #D4A76A;
            --dark: #321B08;
            --light: #FFF8F0;
            --accent: #6D4C3D;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }
        
        /* Animated Logo */
        .logo-container {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1605100804763-247f67b3557e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=100&q=80') center/cover;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 167, 106, 0.5);
            animation: pulse 4s infinite alternate;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(212, 167, 106, 0.5); }
            100% { box-shadow: 0 0 30px rgba(212, 167, 106, 0.8); }
        }
        
        .logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(50, 27, 8, 0.3);
            border-radius: 50%;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease;
        }
        
        .logo-container:hover .logo {
            transform: rotate(15deg) scale(1.1);
        }
        
        /* Navbar */
        .navbar {
            width: 100%;
            height: auto;
            min-height: 70px;
            display: flex;
            flex-wrap: wrap;
            padding: 15px 5%;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(50, 27, 8, 0.9);
            position: fixed;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .nav-links {
            display: flex;
            margin: 10px 0;
        }
        
        .nav-links li {
            list-style: none;
            padding: 10px 20px;
        }
        
        .nav-links a {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--secondary);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-links a:hover {
            color: var(--secondary);
        }
        
        .search-form {
            display: flex;
            align-items: center;
            margin: 10px;
        }
        
        .search-input {
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            width: 180px;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .search-input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .search-input:focus {
            outline: none;
            width: 220px;
            background: rgba(255,255,255,0.2);
        }
        
        .search-btn {
            background-color: transparent;
            color: white;
            border: none;
            margin-left: 10px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            color: var(--secondary);
            transform: scale(1.1);
        }
        
        /* Contact Page Styling */
        .contactpg {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1601479604588-68d9e6d386b5?q=80&w=2013&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            padding: 150px 5% 50px;
            display: flex;
            flex-direction: column;
        }
        
        .row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 50px;
        }
        
        .contact-left, .contact-right {
            flex-basis: 48%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .contact-left h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 36px;
        }
        
        .contact-left p {
            margin: 25px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        
        .contact-left i {
            color: var(--primary);
            margin-right: 15px;
            font-size: 22px;
            width: 30px;
        }
        
        .Socialicons {
            margin-top: 40px;
        }
        
        .Socialicons a {
            text-decoration: none;
            font-size: 28px;
            margin-right: 20px;
            color: var(--dark);
            transition: all 0.3s ease;
        }
        
        .Socialicons a:hover {
            color: var(--primary);
            transform: translateY(-5px);
        }
        
        .contact-right form {
            display: flex;
            flex-direction: column;
        }
        
        .contact-right input, 
        .contact-right textarea {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .contact-right input:focus, 
        .contact-right textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(139, 90, 43, 0.2);
        }
        
        .contact-right textarea {
            resize: vertical;
            min-height: 150px;
        }
        
        .btn2 {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.5s ease;
            align-self: flex-start;
        }
        
        .btn2:hover {
            background-color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            margin-top: auto;
            color: white;
            font-size: 14px;
        }
        
        /* Responsive Design */
        @media (max-width: 992px) {
            .contact-left, .contact-right {
                flex-basis: 100%;
            }
            
            .contact-left {
                margin-bottom: 30px;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                padding: 15px;
            }
            
            .nav-links {
                margin-top: 20px;
                width: 100%;
                justify-content: center;
            }
            
            .search-form {
                width: 100%;
                justify-content: center;
                margin-top: 15px;
            }
            
            .contactpg {
                padding: 120px 5% 50px;
            }
            
            .contact-left h1 {
                font-size: 28px;
            }
            
            .contact-left p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="Beige Cute Minimalistic Candle Logo.png" alt="Scents Logo" class="logo">
        </div>
        
        <ul class="nav-links">
            <li><a href="home.html">HOME</a></li>
            <li><a href="Catagory.html">COLLECTIONS</a></li>
            <li><a href="Aboutus.html">ABOUT US</a></li>
            <li><a href="cntctpg.html">CONTACT</a></li>
        </ul>
        
        <form action="/search" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search ..." class="search-input">
            <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
        </form>
    </nav>

    <!-- Contact Section -->
    <div class="contactpg">
        <div id="contact">
            <div class="row">
                <div class="contact-left">
                    <h1>Contact Us</h1>
                    <p><i class="fa-solid fa-paper-plane"></i> scents@gmail.com</p>
                    <p><i class="fa-solid fa-phone"></i> 0331-2345678</p>
                    <div class="Socialicons">
                        <a href="https://www.instagram.com/_briopk/"><i class="fa-brands fa-instagram"></i></a>
                        <a href="https://tiktok.com/scentedcandles.id"><i class="fa-brands fa-tiktok"></i></a>
                        <a href="https://www.facebook.com/share/i2sBhBuDau8dPV4S/?mibextid=eQY6cl/"><i class="fa-brands fa-facebook"></i></a>
                    </div>
                </div>
                <div class="contact-right">
                    <form>
                        <input type="text" name="Name" placeholder="Your Name" required>
                        <input type="email" name="Email" placeholder="Your Email" required>
                        <textarea name="Message" placeholder="Your Message"></textarea>
                        <button type="submit" class="btn btn2">Submit</button>
                    </form>
                </div>
            </div>
        </div>
        <footer>
            <p>&copy; 2024 Scents. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>

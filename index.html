<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scents - Luxury Fragrances & Candles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/236x/89/55/9e/89559ea3c39439bebdfa0c89d402a6a3.jpg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap');
        
        :root {
            --primary: #8B5A2B;
            --secondary: #D4A76A;
            --dark: #321B08;
            --light: #FFF8F0;
            --accent: #6D4C3D;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }
        
        /* Preloader */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .preloader.fade-out {
            opacity: 0;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid var(--secondary);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Header Styles */
        .navbar {
            width: 100%;
            height: auto;
            min-height: 70px;
            display: flex;
            flex-wrap: wrap;
            padding: 15px 5%;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(50, 27, 8, 0.9);
            position: fixed;
            top: 0;
            z-index: 1000;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }
        
        .navbar.scrolled {
            padding: 10px 5%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        /* Animated Logo */
        .logo-container {
            position: relative;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1605100804763-247f67b3557e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=100&q=80') center/cover;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 167, 106, 0.5);
            animation: pulse 4s infinite alternate;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(212, 167, 106, 0.5); }
            100% { box-shadow: 0 0 30px rgba(212, 167, 106, 0.8); }
        }
        
        .logo-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(50, 27, 8, 0.3);
            border-radius: 50%;
        }
        
        .logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease;
        }
        
        .logo-container:hover .logo {
            transform: rotate(15deg) scale(1.1);
        }
        
        .nav-links {
            display: flex;
            margin: 10px 0;
            transition: all 0.5s ease;
        }
        
        .nav-links li {
            list-style: none;
            padding: 10px 20px;
            position: relative;
        }
        
        .nav-links a {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--secondary);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover::after {
            width: 100%;
        }
        
        .nav-links a:hover {
            color: var(--secondary);
        }
        
        .search-form {
            display: flex;
            align-items: center;
            margin: 10px;
        }
        
        .search-input {
            padding: 10px 15px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            width: 180px;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .search-input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        .search-input:focus {
            outline: none;
            width: 220px;
            background: rgba(255,255,255,0.2);
        }
        
        .search-btn {
            background-color: transparent;
            color: white;
            border: none;
            margin-left: 10px;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            color: var(--secondary);
            transform: scale(1.1);
        }
        
        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1601479604588-68d9e6d386b5?q=80&w=2013&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            margin-top: 70px; /* Added to account for fixed navbar */
        }
        
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }
        
        .hero-content {
            display: flex;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        
        .hero-image-container {
            flex: 1;
            position: relative;
            perspective: 1000px;
            padding: 20px;
        }
        
        .hero-image {
            width: 100%;
            max-width: 400px;
            height: 500px;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            border: 10px solid rgba(255,255,255,0.1);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(5deg); }
        }
        
        .hero-text {
            flex: 1;
            padding: 0 5%;
            color: white;
        }
        
        .hero-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--secondary);
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }
        
        .hero-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 60px;
            font-weight: 700;
            color: white;
            margin-bottom: 30px;
            line-height: 1.2;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            opacity: 0;
            animation: fadeInUp 1s ease 0.7s forwards;
        }
        
        .hero-text p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 1s ease 0.9s forwards;
        }
        
        .hero-text .highlight {
            color: var(--secondary);
            position: relative;
            display: inline-block;
        }
        
        .hero-text .highlight::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            height: 10px;
            background-color: rgba(212, 167, 106, 0.3);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left;
            animation: highlight 1.5s ease 1.2s forwards;
        }
        
        @keyframes highlight {
            to { transform: scaleX(1); }
        }
        
        .discover-btn {
            background-color: transparent;
            color: white;
            font-size: 18px;
            font-family: 'Montserrat', sans-serif;
            padding: 15px 40px;
            border: 2px solid var(--secondary);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }
        
        .discover-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 167, 106, 0.4), transparent);
            transition: all 0.7s ease;
        }
        
        .discover-btn:hover {
            background-color: var(--secondary);
            color: var(--dark);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .discover-btn:hover::before {
            left: 100%;
        }
        
        /* Floating Elements */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .floating-element {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.3;
            animation: floatAround 15s linear infinite;
        }
        
        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, 50px) rotate(90deg); }
            50% { transform: translate(100px, 0) rotate(180deg); }
            75% { transform: translate(50px, -50px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            cursor: pointer;
            color: white;
            font-size: 28px;
            z-index: 1001;
            transition: all 0.3s ease;
        }
        
        .menu-toggle:hover {
            color: var(--secondary);
        }
        
        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive Styles */
        @media (max-width: 1200px) {
            .hero-text h1 {
                font-size: 48px;
            }
            
            .hero-image {
                max-width: 350px;
                height: 450px;
            }
        }
        
        @media (max-width: 992px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
                padding-top: 80px;
            }
            
            .hero-image {
                max-width: 300px;
                height: 400px;
                margin-bottom: 40px;
            }
            
            .hero-text {
                padding: 0 20px;
            }
            
            .hero-text h1 {
                font-size: 36px;
            }
            
            .hero-text h2 {
                font-size: 24px;
            }
            
            .nav-links {
                position: fixed;
                top: 0;
                left: -100%;
                width: 80%;
                height: 100vh;
                background-color: var(--dark);
                flex-direction: column;
                justify-content: center;
                transition: all 0.5s ease;
            }
            
            .nav-links.active {
                left: 0;
            }
            
            .nav-links li {
                padding: 20px;
                text-align: center;
            }
            
            .menu-toggle {
                display: block;
            }
            
            .search-form {
                width: 100%;
                justify-content: center;
                margin-top: 20px;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }
            
            .hero {
                margin-top: 60px;
            }
            
            .hero-text h1 {
                font-size: 32px;
            }
            
            .hero-text p {
                font-size: 16px;
            }
            
            .search-input {
                width: 70%;
            }
        }
        
        @media (max-width: 576px) {
            .hero-image {
                max-width: 250px;
                height: 350px;
            }
            
            .hero-text h1 {
                font-size: 28px;
            }
            
            .discover-btn {
                padding: 12px 30px;
                font-size: 16px;
            }
            
            .hero-content {
                padding-top: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div class="preloader">
        <div class="loader"></div>
    </div>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="Beige Cute Minimalistic Candle Logo.png" alt="Scents Logo" class="logo">
        </div>
        
        <div class="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>
        
        <ul class="nav-links">
            <li><a href="index.html">HOME</a></li>
            <li><a href="Catagory.html">COLLECTIONS</a></li>
            <li><a href="Aboutus.html">ABOUT US</a></li>
            <li><a href="cntctpg.html">CONTACT</a></li>
        </ul>
        
        <form action="/search" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search ..." class="search-input">
            <button type="submit" class="search-btn"><i class="fas fa-search"></i></button>
        </form>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="floating-elements">
            <div class="floating-element" style="width: 50px; height: 50px; top: 20%; left: 10%; background-image: url('Beam.png');"></div>
            <div class="floating-element" style="width: 40px; height: 40px; top: 70%; left: 80%; background-image: url('Beam.png');"></div>
            <div class="floating-element" style="width: 60px; height: 60px; top: 40%; left: 85%; background-image: url('Beam.png');"></div>
        </div>
        
        <div class="hero-content">
            <div class="hero-image-container animate__animated animate__fadeInLeft">
                <img src="https://plus.unsplash.com/premium_photo-1666632532494-3780d6cae861?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Y2FuZGxlc3xlbnwwfHwwfHx8MA%3D%3D" alt="Luxury Candles" class="hero-image">
            </div>
            
            <div class="hero-text">
                <h2 class="animate__animated">Perfumes & Candles</h2>
                <h1 class="animate__animated"><span style="color: var(--light);">Unwind</span> your Exhaustion with our <span class="highlight">Premium</span> Scents</h1>
                <p class="animate__animated">Experience the luxury of handcrafted fragrances that transform your space into a sanctuary of relaxation and elegance.</p>
                <a href="discover.html"><button class="discover-btn animate__animated">DISCOVER</button></a>
            </div>
        </div>
    </section>

    <script>
        // Preloader
        window.addEventListener('load', function() {
            const preloader = document.querySelector('.preloader');
            setTimeout(() => {
                preloader.classList.add('fade-out');
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 500);
            }, 1500);
        });
        
        // Mobile menu toggle
        document.querySelector('.menu-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
            this.querySelector('i').classList.toggle('fa-times');
        });
        
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
        
        // Create more floating elements dynamically
        document.addEventListener('DOMContentLoaded', function() {
            const floatingContainer = document.querySelector('.floating-elements');
            const elements = [
                'Beam.png',
                'Beam.png',
                'Beam.png'
            ];
            
            for (let i = 0; i < 8; i++) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.style.width = `${Math.random() * 30 + 20}px`;
                element.style.height = element.style.width;
                element.style.top = `${Math.random() * 100}%`;
                element.style.left = `${Math.random() * 100}%`;
                element.style.backgroundImage = `url('${elements[Math.floor(Math.random() * elements.length)]}')`;
                element.style.opacity = Math.random() * 0.3 + 0.1;
                element.style.animationDuration = `${Math.random() * 10 + 10}s`;
                element.style.animationDelay = `${Math.random() * 5}s`;
                floatingContainer.appendChild(element);
            }
        });
    </script>
</body>
</html>
